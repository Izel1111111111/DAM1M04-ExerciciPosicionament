<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanWear - Contacte</title>
    <link rel="stylesheet" href="estils.css">
</head>
<body>

    <header class="menu">
        <h2>UrbanWear</h2>
        <nav>
            <a href="index.html">Inici</a>
            <a href="productes.html">Productes</a>
            <a href="contacte.html">Contacte</a>
        </nav>
    </header>

    <main class="contenidor">

        <section class="capcalera">
            <h1>Contacte</h1>
            <p>Contacta amb nosaltres si tens algun dubte.</p>
        </section>

        <section class="contacte">

            <div class="formulari">
                <h2>Envia un missatge</h2>

                <form>
                    <label for="nom">Nom:</label>
                    <input type="text" id="nom" name="nom">

                    <label for="email">Correu electrònic:</label>
                    <input type="email" id="email" name="email">

                    <label for="missatge">Missatge:</label>
                    <textarea id="missatge" name="missatge"></textarea>

                    <button type="submit">Enviar</button>
                </form>
            </div>

            <div class="informacio">
                <h2>Informació</h2>
                <p>Adreça: Carrer Major, 25, Barcelona</p>
                <p>Horari: Dilluns a divendres, de 9:00 a 20:00</p>
                <p>Telèfon: 600 123 456</p>

                <div class="mapa">
                    Mapa de Barcelona
                </div>
            </div>

        </section>

    </main>

    <footer>
        <p>UrbanWear - 2026</p>
        <p>info@urbanwear.cat</p>
    </footer>

</body>
</html>
